# Rotação de logs dos contêineres: no máximo 3 arquivos de 10 MB por serviço
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    command:
      - postgres
      - -p
      - "54329"                       # porta padrão 5432 -> 54329
      - -c
      - log_connections=on            # registra cada conexão
      - -c
      - log_disconnections=on         # registra cada desconexão e duração
      - -c
      - log_statement=ddl             # registra mudanças de estrutura (CREATE, ALTER, DROP)
      - -c
      - log_min_duration_statement=500  # registra consultas lentas (> 500 ms)
      - -c
      - log_line_prefix=%m [%p] %u@%d   # data, processo, usuário e banco em cada linha
      - -c
      - log_parameter_max_length=0      # NÃO grava valores de parâmetros nos logs (a chave
      - -c
      - log_parameter_max_length_on_error=0   # do pgcrypto viaja como parâmetro)
    environment:
      POSTGRES_USER: ${DB_USER}       # usuário padrão "postgres" trocado
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:54329:54329"       # só acessível da própria máquina
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    logging: *logging
    labels:
      com.datadoghq.ad.logs: '[{"source":"postgresql","service":"nino-db"}]'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 54329 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "54329"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_KEY: ${JWT_KEY}
      DB_ENC_KEY: ${DB_ENC_KEY}
      PASSWORD_MAX_AGE_DAYS: ${PASSWORD_MAX_AGE_DAYS:-90}
    ports:
      - "127.0.0.1:5080:8080"
    logging: *logging
    labels:
      com.datadoghq.ad.logs: '[{"source":"csharp","service":"nino-api"}]'

  # Observabilidade (Datadog). Só sobe quando pedido:  docker compose --profile obs up -d
  datadog:
    image: gcr.io/datadoghq/agent:7
    profiles: ["obs"]
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_HOSTNAME: nino-dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging

volumes:
  pgdata:
